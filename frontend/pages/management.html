<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Safety Logger - Management Dashboard</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body data-page="management">
  <header class="topbar">
    <div class="brand-text">Campus Safety Logger</div>
    <div class="topbar-actions">
      <span id="userName" class="muted">Loading...</span>
      <button id="logoutButton" class="logout-btn" type="button">Logout</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar">
      <nav class="nav-list">
        <a class="nav-link active" href="/management/dashboard">Management Dashboard</a>
        <a class="nav-link" href="/management/profile">Profile</a>
      </nav>
    </aside>

    <section class="content">
      <div class="page-header">
        <h1>Management Dashboard</h1>
      </div>
      <div id="managementMessage" class="message-box" role="status" aria-live="polite"></div>

      <div id="managementStats" class="stats-grid"></div>

      <div class="card">
        <div class="form-grid">
          <div class="form-group">
            <label for="statusFilter">Filter by Status</label>
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="Submitted">Submitted</option>
              <option value="Under Review">Under Review</option>
              <option value="Assigned">Assigned</option>
              <option value="Investigating">Investigating</option>
              <option value="Action Taken">Action Taken</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
          <div class="form-group">
            <label for="searchInput">Search</label>
            <input id="searchInput" type="text" placeholder="Search title, location, description, or student" />
          </div>
          <div class="form-group">
            <label for="severityFilter">Severity</label>
            <select id="severityFilter">
              <option value="all">All severities</option>
              <option value="Critical">Critical</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="urgencyFilter">Urgency</label>
            <select id="urgencyFilter">
              <option value="all">All urgencies</option>
              <option value="Immediate">Immediate</option>
              <option value="High">High</option>
              <option value="Normal">Normal</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>
      </div>

      <div class="grid-two management-workspace">
        <section aria-labelledby="incomingReportsHeading">
          <div class="section-heading">
            <h2 id="incomingReportsHeading">Recent Student Reports</h2>
            <span id="managementReportCount" class="muted-text"></span>
          </div>
          <div id="managementReportList" class="report-list"></div>
        </section>
        <section class="card management-notifications" aria-labelledby="managementNotificationsHeading">
          <div class="section-heading">
            <h2 id="managementNotificationsHeading">Notifications</h2>
            <button id="managementMarkNotificationsRead" class="secondary-btn" type="button">Mark all read</button>
          </div>
          <div id="managementNotifications"><div class="empty-state">Loading notifications...</div></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
