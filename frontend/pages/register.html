<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus Safety Logger - Register</title><link rel="stylesheet" href="/css/auth.css"></head>
<body><main class="auth-container"><section class="auth-card"><div class="brand"><div class="brand-icon">🛡️</div>
<h1>Create Student Account</h1><p>Join Campus Safety Logger</p></div>
<form id="registerForm"><div class="form-group"><label for="fullName">Full Name</label><input type="text" id="fullName" placeholder="Enter your full name" maxlength="100" required></div>
<div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="Enter your email" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required></div>
<button type="submit" id="registerButton">Create Account</button><div id="message" class="message" role="alert"></div></form>
<p class="auth-footer">Already have an account? <a href="/login">Login</a></p></section></main>
<script src="/js/auth.js"></script></body></html>
