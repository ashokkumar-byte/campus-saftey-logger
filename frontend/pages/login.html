<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus Safety Logger - Login</title><link rel="stylesheet" href="/css/auth.css"></head>
<body><main class="auth-container"><section class="auth-card"><div class="brand"><div class="brand-icon">🛡️</div>
<h1>Campus Safety Logger</h1><p>Secure campus safety reporting system</p></div>
<form id="loginForm"><div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="Enter your email" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
<button type="submit" id="loginButton">Login</button><div id="message" class="message" role="alert"></div></form>
<p class="auth-footer">Don't have an account? <a href="/register">Register as Student</a></p>
</section></main>
<script src="/js/auth.js"></script></body></html>
